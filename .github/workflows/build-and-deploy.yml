name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: jy-project-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, reservation, inventory, payment, notification]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263232886346:role/github-actions-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: jy-project/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "./${{ matrix.service }}"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch config from SSM
        run: |
          aws ssm get-parameters \
            --names "/jy-project/ecs-execution-role-arn" "/jy-project/ecs-task-role-arn" "/jy-project/rds-secret-arn" "/jy-project/dd-site" \
            --query "Parameters" --output json > ssm-params.json

          echo "ECS_EXECUTION_ROLE_ARN=$(jq -r '.[] | select(.Name=="/jy-project/ecs-execution-role-arn").Value' ssm-params.json)" >> "$GITHUB_ENV"
          echo "ECS_TASK_ROLE_ARN=$(jq -r '.[] | select(.Name=="/jy-project/ecs-task-role-arn").Value' ssm-params.json)" >> "$GITHUB_ENV"
          echo "RDS_SECRET_ARN=$(jq -r '.[] | select(.Name=="/jy-project/rds-secret-arn").Value' ssm-params.json)" >> "$GITHUB_ENV"
          echo "DD_SITE=$(jq -r '.[] | select(.Name=="/jy-project/dd-site").Value' ssm-params.json)" >> "$GITHUB_ENV"

      - name: Substitute config values into task definition
        run: |
          envsubst '$ECS_EXECUTION_ROLE_ARN,$ECS_TASK_ROLE_ARN,$RDS_SECRET_ARN,$DD_SITE' \
            < taskdefs/${{ matrix.service }}.json > taskdefs/${{ matrix.service }}.rendered.json

      - name: Render new task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdefs/${{ matrix.service }}.rendered.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: jy-project-${{ matrix.service }}-service
          cluster: ${{ env.ECS_CLUSTER }}
